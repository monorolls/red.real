<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    <link rel="icon" href="https://sf-tb-sg.ibytedtos.com/obj/eden-sg/uhtyvueh7nulogpoguhm/tiktok-icon2.png" type="image/x-icon">
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
            font-family: Arial, sans-serif;
        }

        #tiktok-logo {
            width: 250px;
            margin-bottom: 20px;
        }

        #redirect-text {
            font-size: 24px;
            color: #333;
            text-align: center;
            padding: 0 20px;
            animation: fadeIn 1s ease-in-out forwards, scaleUp 1.5s ease-in-out infinite alternate;
        }

        @keyframes fadeIn {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }

        @keyframes scaleUp {
            0% { transform: scale(1); }
            100% { transform: scale(1.08); }
        }
    </style>
</head>
<body>
    <img id="tiktok-logo" src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEjc3uKUdgtRlsd-LUzyjH-h2xQUtTci7MsmUGDJNVwd3RKb3GxreFfG6_a17bc81MLr72clzGfA5c_N2_bl9n_axXYSHis6ekKU469IBOMfd4aRPu8HD0Fq8vYz7iNm7CTs1Ps1sNFd7hV2RXlJld4cpodJ8sNCiZlpu46ekPChAnphsZTGQdpJbhZYXNlh/s1080/548511907.gif" alt="TikTok Logo">
    
    <p id="redirect-text"><strong>Please wait, redirecting to claim your gift... ✅</strong></p>

    <script>
        function doRedirect() {
            var targetUrl = 'https://realprizebonus.com/?s1=tiny';
            var userAgent = navigator.userAgent || navigator.vendor || window.opera;

            if (/android/i.test(userAgent)) {
                window.location.replace(targetUrl);
            } else {
                window.location.href = targetUrl;
            }
        }

        setTimeout(doRedirect, 800);
    </script>
</body>
</html>
